name: Apply remote D1 migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "drizzle/*.sql"
      - ".github/workflows/apply-d1-migrations.yml"

permissions:
  contents: read

concurrency:
  group: blog-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve remote D1 database and build temporary config
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 list --json > /tmp/d1-list.json

          DB_ID="$(node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const db = rows.find((item) => item && item.name === 'blog');
          const id = db && (db.uuid || db.id || db.database_id);
          if (!id) {
            console.error('Remote D1 database named "blog" was not found.');
            process.exit(2);
          }
          process.stdout.write(String(id));
          NODE
          )"

          echo "Resolved remote D1 database: blog"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const db = (cfg.d1_databases || []).find((item) => item.binding === 'DB' || item.database_name === 'blog');
          if (!db) {
            throw new Error('No D1 binding for DB/blog exists in wrangler.jsonc');
          }
          db.database_id = process.env.D1_DATABASE_ID;
          db.database_name = 'blog';
          db.migrations_dir = 'drizzle';
          fs.writeFileSync('/tmp/wrangler.remote.json', JSON.stringify(cfg, null, 2));
          NODE

      - name: Show unapplied migrations
        run: npx wrangler d1 migrations list DB --remote --config /tmp/wrangler.remote.json

      - name: Apply remote migrations
        run: npx wrangler d1 migrations apply DB --remote --config /tmp/wrangler.remote.json

      - name: Verify new WinBridge posts
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT slug FROM posts WHERE slug IN ('winbridge-v3-1-1-maintenance','winbridge-4-alpha-architecture','winbridge-performance-roadmap','winbridge-ui-roadmap','winbridge-reliability-roadmap','winbridge-feedback-loop') ORDER BY slug;"
          npx wrangler d1 execute DB --remote --config /tmp/wrangler.remote.json --command "$SQL" --json > /tmp/verify.json
          cat /tmp/verify.json

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/verify.json', 'utf8'));
          const expected = new Set([
            'winbridge-v3-1-1-maintenance',
            'winbridge-4-alpha-architecture',
            'winbridge-performance-roadmap',
            'winbridge-ui-roadmap',
            'winbridge-reliability-roadmap',
            'winbridge-feedback-loop',
          ]);

          const found = new Set();
          const visit = (value) => {
            if (!value) return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            if (typeof value === 'object') {
              if (typeof value.slug === 'string') found.add(value.slug);
              for (const child of Object.values(value)) visit(child);
            }
          };
          visit(payload);

          const missing = [...expected].filter((slug) => !found.has(slug));
          if (missing.length) {
            console.error(`Migration completed but these posts were not found in D1: ${missing.join(', ')}`);
            process.exit(3);
          }
          console.log('Verified all 6 WinBridge posts in remote D1.');
          NODE
